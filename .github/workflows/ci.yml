name: Quest3-Pyrowave
on:
  push:
    branches: [main]
    # Findings do not change the reconstructed native inputs. Explicit dispatch
    # remains available for regression-only or full matching artifact builds.
    paths-ignore:
      - '**.md'
      - 'results/**'
  pull_request:
  workflow_dispatch:
    inputs:
      tests_only:
        description: Run regression checks without rebuilding APK/server
        type: boolean
        default: false
permissions:
  contents: read
env:
  RUST_TOOLCHAIN: '1.97.1'
  NDK_VERSION: '27.2.12479018'
  XRWIRED_INPUTS: ${{ github.workspace }}/ws
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - name: Ready-fence fallback and descriptor ownership (CPU only)
        run: |
          rustc --edition=2021 --test tools/fences/ready_wait.rs -o /tmp/ready-wait-test
          /tmp/ready-wait-test
          rustc --edition=2021 --test tools/fences/ready_frames.rs -o /tmp/ready-frames-test
          /tmp/ready-frames-test
          rustc --edition=2021 --test tools/fences/latest_wait.rs -o /tmp/latest-wait-test
          /tmp/latest-wait-test
          rustc --edition=2021 --test tools/fences/native_ready_test.rs -o /tmp/native-ready-test
          /tmp/native-ready-test
          rustc --edition=2021 --test tools/quest3/producer_opportunity.rs -o /tmp/producer-opportunity-test
          /tmp/producer-opportunity-test
          rustc --edition=2021 --test tools/quest3/producer_prerecord.rs -o /tmp/producer-prerecord-test
          /tmp/producer-prerecord-test
          rustc --edition=2021 --test tools/quest3/cadence_probe.rs -o /tmp/cadence-probe-test
          /tmp/cadence-probe-test
      - name: CPU source-chart scale and stripe regression (no VR)
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/requirements-test.txt
          python3 -m tools.quest3.scene_pattern_test -v
      - name: Bounded producer reservation and cancellation (CPU only)
        run: g++ -std=c++17 -Wall -Wextra -Werror tools/pyroclient/prerecord_state_test.cpp -o /tmp/prerecord-state && /tmp/prerecord-state
      - name: Release-fence ownership and generation regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -pthread tools/pyroclient/release_fence_registry_test.cpp -o /tmp/release-fence-test && /tmp/release-fence-test
      - run: g++ -std=c++17 -Wall -Werror tools/pyroclient/decode_path_test.cpp -o /tmp/decode-path && /tmp/decode-path
      - name: Experimental fused-colour eligibility and mode interactions (CPU only)
        run: g++ -std=c++17 -Wall -Wextra -Werror tools/pyroclient/fuse_color_policy_test.cpp -o /tmp/fuse-color-policy && /tmp/fuse-color-policy
      - name: Adreno LPAC queue-family choice (CPU only)
        run: g++ -std=c++17 -Wall -Wextra -Werror tools/pyroclient/lpac_queue_test.cpp -o /tmp/lpac-queue && /tmp/lpac-queue
      - name: Optical latency stamp layout round trip (CPU only)
        run: g++ -std=c++17 -Wall -Wextra -Werror tools/latency/latency_stamp_test.cpp -o /tmp/latency-stamp && /tmp/latency-stamp
      - name: Surface chart orientation and channel order (CPU only)
        run: g++ -std=c++17 -Wall -Wextra -Werror tools/pyroclient/surface_chart_pixels_test.cpp -o /tmp/surface-chart-pixels && /tmp/surface-chart-pixels
      - name: Software GLES readback correctness (no Quest hardware)
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tools/pyroclient/gpu_readback_gles.cpp tools/pyroclient/gpu_readback_test.cpp -lEGL -lGLESv2 -o /tmp/readback-test
          /tmp/readback-test
          python3 -m tools.foveation.gpu_fixture /tmp/light-foveation-reference.txt
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tools/pyroclient/gpu_readback_gles.cpp tools/foveation/gpu_test.cpp -lEGL -lGLESv2 -o /tmp/light-foveation-test
          /tmp/light-foveation-test tools/foveation/light.glsl /tmp/light-foveation-reference.txt
  fuse_color_exact:
    # Default-off debug.q3pw.fuse_color must reproduce the shipped iDWT + convert bytes exactly.
    # Software Vulkan proves shader logic, formats, edges and wiring; not Adreno rounding or speed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct patched PyroWave shaders only
        run: Q3PW_PYROWAVE_ONLY=1 sh tools/ci/fetch_sources.sh /tmp/fuse-src
      - name: Mesa lavapipe and the Khronos validation layer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan-dev vulkan-validationlayers
      - name: Fused colour pass versus shipped two-pass output, both FP16 variants (no headset)
        run: |
          ls /usr/share/vulkan/icd.d/
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          test -n "$icd"
          export VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd"
          for v in 0 1; do
            python3 tools/pyroclient/extract_pyrowave_spirv.py /tmp/fuse-src/pyrowave/shaders/slangmosh.hpp idwt 1 "$v" "/tmp/idwt-fp16-$v.spv"
          done
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-missing-field-initializers -Werror tools/pyroclient/fuse_color_vk_test.cpp -lvulkan -o /tmp/fuse-color-vk-test
          /tmp/fuse-color-vk-test /tmp/idwt-fp16-0.spv 0
          /tmp/fuse-color-vk-test /tmp/idwt-fp16-1.spv 1
  dequant_haar_gate:
    # Software Vulkan (lavapipe) proves the fused dequant + level-0 Haar kernel writes the same
    # planes as the separate dequant and final Haar passes for the same bitstream, and that the
    # decode stays above 30 dB luma PSNR against the source.
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct production decoder source
        run: sh tools/ci/fetch_sources.sh "$XRWIRED_INPUTS/research"
      - name: Software Vulkan and native build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build mesa-vulkan-drivers libvulkan-dev
      - name: Linux PyroWave library
        run: |
          PW="$XRWIRED_INPUTS/research/pyrowave"
          python3 tools/ci/check_shader_manifest.py "$PW"
          cmake -S "$PW" -B "$PW/build-linux" -G Ninja -DCMAKE_BUILD_TYPE=Release -DPYROWAVE_DEVEL=OFF -DPYROWAVE_FP32_MATH=ON
          cmake --build "$PW/build-linux" --target pyrowave-shared
      - name: Fused dequant exact-pixel gate (lavapipe, no headset)
        env:
          GATE_PACKET_DIR: /tmp/dequant-haar-gate
        run: |
          PW="$XRWIRED_INPUTS/research/pyrowave"
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-missing-field-initializers -I"$PW" -I"$PW/Granite/third_party/khronos/vulkan-headers/include" \
            tools/pyroclient/dequant_haar_gate.cpp -o /tmp/dequant_haar_gate -L"$PW/build-linux" -lpyrowave-shared -lvulkan -Wl,-rpath,"$PW/build-linux"
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          mkdir -p "$GATE_PACKET_DIR"
          set -o pipefail
          grep -m1 'model name' /proc/cpuinfo || true
          grep -o -m1 'avx512[a-z]*' /proc/cpuinfo | head -n 1 || echo "no avx512"
          # PyroWave's encoder and dequant need 16-64 lane subgroups, so lavapipe runs with
          # 512-bit vectors (16 lanes); at 256 bits the dequant scan is wrong by design. Lavapipe
          # returns zero from texture and texel-buffer fetches in lanes 8-15 of shaders that use
          # subgroup size control, and its linear-texture payload path crashes, so decode reads
          # payloads through SSBOs (PYROWAVE_FORCE_SSBO). This configuration decodes faithfully.
          LP_NATIVE_VECTOR_WIDTH=512 PYROWAVE_NO_LINEAR_TEX=1 PYROWAVE_FORCE_SSBO=1 \
            /tmp/dequant_haar_gate 512 320 131072 | tee /tmp/dequant_haar_gate.txt
          grep -q DEQUANT_HAAR_GATE_PASS /tmp/dequant_haar_gate.txt
  publication_tests:
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct production decoder source
        run: sh tools/ci/fetch_sources.sh "$XRWIRED_INPUTS/research"
      - name: Linux client library prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libclang-dev libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libgtk-3-dev libxrandr-dev libunwind-dev
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ws/research/ALVR-20.13.0/target/release
          key: q3pw-publication-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ github.sha }}
          restore-keys: |
            q3pw-publication-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Production frame-slot races and Unix descriptor ownership
        working-directory: ws/research/ALVR-20.13.0
        run: cargo +"$RUST_TOOLCHAIN" test --release -p alvr_client_core --lib
  client:
    runs-on: ubuntu-24.04
    needs: [tests, publication_tests]
    if: ${{ !cancelled() && inputs.tests_only != true && needs.tests.result == 'success' && needs.publication_tests.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct pinned source trees
        run: sh tools/ci/fetch_sources.sh "$XRWIRED_INPUTS/research"
      - name: Cache Rust dependencies and compiled Android targets
        id: cargo_client_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ws/research/ALVR-20.13.0/target/release
            ws/research/ALVR-20.13.0/target/debug
            ws/research/ALVR-20.13.0/target/aarch64-linux-android/release
          key: q3pw-client-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.NDK_VERSION }}-${{ github.sha }}
          restore-keys: |
            q3pw-client-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.NDK_VERSION }}-
      - name: Android toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "XRWIRED_ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "XRWIRED_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-linux-android
      - name: Restore pinned Android build tools
        id: android_tools_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/cbindgen
            ~/.cargo/bin/cargo-apk
          key: q3pw-android-tools-v1-ubuntu24-${{ env.RUST_TOOLCHAIN }}-ndk4.1.2-cbindgen0.29.4-apk0fd3126dad5aa1c5f0f26cdae3410f2e5af62c60
      - name: Install pinned Android build tools on cache miss
        if: steps.android_tools_cache.outputs.cache-hit != 'true'
        run: |
          cargo +"$RUST_TOOLCHAIN" install --locked cargo-ndk@4.1.2 cbindgen@0.29.4
          cargo +"$RUST_TOOLCHAIN" install --locked --git https://github.com/zarik5/cargo-apk --rev 0fd3126dad5aa1c5f0f26cdae3410f2e5af62c60 cargo-apk
      - name: Verify cached tool executables
        run: |
          test -x "$HOME/.cargo/bin/cargo-ndk"
          test -x "$HOME/.cargo/bin/cbindgen"
          test -x "$HOME/.cargo/bin/cargo-apk"
      - name: Save pinned Android tools before application compilation
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.android_tools_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/cbindgen
            ~/.cargo/bin/cargo-apk
          key: ${{ steps.android_tools_cache.outputs.cache-primary-key }}
      - name: Khronos loader used by upstream ALVR on Quest 3
        run: |
          dest="$XRWIRED_INPUTS/research/ALVR-20.13.0/deps/android_openxr/arm64-v8a"
          mkdir -p "$dest" /tmp/openxr
          curl -fsSL -o /tmp/openxr/loader.aar https://github.com/KhronosGroup/OpenXR-SDK-Source/releases/download/release-1.0.34/openxr_loader_for_android-1.0.34.aar
          unzip -q /tmp/openxr/loader.aar -d /tmp/openxr
          cp /tmp/openxr/prefab/modules/openxr_loader/libs/android.arm64-v8a/libopenxr_loader.so "$dest/"
      - name: Stable Quest development signing
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.QUEST3_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.QUEST3_SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ] && [ -n "$SIGNING_PASSWORD" ]; then
            mkdir -p "$RUNNER_TEMP/quest3-signing"
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/quest3-signing/release.p12"
            echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/quest3-signing/release.p12" >> "$GITHUB_ENV"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Native libraries, probes and APK
        run: |
          sh tools/build_pyrowave_android.sh
          bash tools/pyrowave_android/build.sh
          bash tools/udptest/build.sh
          sh tools/build_alvr_2013.sh
      - name: Package development build
        run: |
          mkdir out
          python3 tools/ci/package_licenses.py "$XRWIRED_INPUTS/research" /tmp/quest3-notices/LICENSES
          (cd /tmp/quest3-notices && zip -qr "$GITHUB_WORKSPACE/out/LICENSES.zip" LICENSES)
          cp "$XRWIRED_INPUTS/research/ALVR-20.13.0/build/alvr_client_android/alvr_client_android.apk" out/Quest3-Pyrowave-dev.apk
          cp "$XRWIRED_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" out/
          cp tools/pyroclient/prerecord_gpu_test tools/pyrowave_android/pyrowave_android tools/udptest/udprecv-android tools/pyroclient/pyroclient_test tools/pyroclient/dequant_haar_gate tools/pyroclient/release_fence_gpu_test tools/pyroclient/ready_fence_gpu_test tools/pyroclient/libpyroclient.so "$XRWIRED_INPUTS/research/pyrowave/build-android/libpyrowave-shared.so" out/
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/Quest3-Pyrowave-dev.apk > out/APK-CERTIFICATE.txt
          (cd out && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Quest3-Pyrowave-Android
          path: out/
      - name: Save reusable Android compilation after success or test failure
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo_client_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ws/research/ALVR-20.13.0/target/release
            ws/research/ALVR-20.13.0/target/debug
            ws/research/ALVR-20.13.0/target/aarch64-linux-android/release
          key: ${{ steps.cargo_client_cache.outputs.cache-primary-key }}
  streamer:
    runs-on: windows-2022
    needs: [tests, publication_tests]
    if: ${{ !cancelled() && inputs.tests_only != true && needs.tests.result == 'success' && needs.publication_tests.result == 'success' }}
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Reconstruct pinned sources
        shell: bash
        run: sh tools/ci/fetch_sources.sh "$XRWIRED_INPUTS/research"
      - name: Cache Rust dependencies and compiled Windows targets
        id: cargo_streamer_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ws/research/ALVR-20.13.0/target/release
            ws/research/ALVR-20.13.0/target/debug
          key: q3pw-streamer-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ github.sha }}
          restore-keys: |
            q3pw-streamer-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - run: rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
      - name: Check Windows process isolation before native builds
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = $env:RUST_TOOLCHAIN
          Set-Location "$env:XRWIRED_INPUTS/research/ALVR-20.13.0"
          cargo test --release -p alvr_adb --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PyroWave and ALVR streamer
        shell: cmd
        run: |
          call tools\windows\build_pyrowave_pc.cmd interop || exit /b 1
          call tools\windows\build_streamer.cmd || exit /b 1
      - name: Frame assembly and preset regression tests
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = $env:RUST_TOOLCHAIN
          Set-Location "$env:XRWIRED_INPUTS/research/ALVR-20.13.0"
          cargo test --release -p alvr_client_core --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p alvr_session --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p alvr_packets --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p alvr_server_core --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p alvr_server_io --lib initialization_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p alvr_dashboard --bin alvr_dashboard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          python tools/ci/package_licenses.py "$env:XRWIRED_INPUTS/research" "$env:XRWIRED_INPUTS/research/ALVR-20.13.0/build/alvr_streamer_windows/LICENSES"
          Compress-Archive "$env:XRWIRED_INPUTS/research/ALVR-20.13.0/build/alvr_streamer_windows/*" out/Quest3-Pyrowave-Windows.zip
          (Get-FileHash out/Quest3-Pyrowave-Windows.zip).Hash.ToLower() + '  Quest3-Pyrowave-Windows.zip' | Set-Content out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Quest3-Pyrowave-Windows
          path: out/
      - name: Save reusable Windows compilation after success or test failure
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo_streamer_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ws/research/ALVR-20.13.0/target/release
            ws/research/ALVR-20.13.0/target/debug
          key: ${{ steps.cargo_streamer_cache.outputs.cache-primary-key }}
