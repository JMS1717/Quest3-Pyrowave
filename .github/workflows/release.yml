name: Release
# Publishes a prerelease from the artifacts of one successful push-to-main CI run. Nothing is
# rebuilt: the APK is the stable-signed main build, checked against its run's SHA256SUMS and against
# the reference release's signing certificate. Signing keys never enter this workflow.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Quest3-Pyrowave CI run on a push to main
        required: true
      tag:
        description: New tag, e.g. v0.1.0-alpha.9
        required: true
      title:
        description: Release title
        required: true
      notes_path:
        description: Release notes file in this repository, e.g. docs/RELEASE-alpha.9.md
        required: true
      expect_version:
        description: Client version suffix the APK must report, e.g. .62
        required: true
      reference_tag:
        description: Earlier release whose APK certificate must match
        default: v0.1.0-alpha.8
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
      TITLE: ${{ inputs.title }}
      NOTES_PATH: ${{ inputs.notes_path }}
      EXPECT_VERSION: ${{ inputs.expect_version }}
      REFERENCE_TAG: ${{ inputs.reference_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the source run
        run: |
          set -eu
          case "$RUN_ID" in *[!0-9]*|'') echo "run_id must be numeric"; exit 1;; esac
          test -f "$NOTES_PATH" || { echo "missing notes file $NOTES_PATH"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .path == ".github/workflows/ci.yml" and .event == "push" and .head_branch == "main"
            and .status == "completed" and .conclusion == "success"
            and .head_repository.full_name == $repo' run.json >/dev/null \
            || { echo "run $RUN_ID is not a successful push-to-main CI run"; jq '{path,event,head_branch,status,conclusion}' run.json; exit 1; }
          echo "SOURCE_SHA=$(jq -r .head_sha run.json)" >> "$GITHUB_ENV"
          echo "RUN_URL=$(jq -r .html_url run.json)" >> "$GITHUB_ENV"
      - name: Download artifacts and reference certificate
        run: |
          set -eu
          gh run download "$RUN_ID" -n Quest3-Pyrowave-Android -D "$RUNNER_TEMP/android"
          gh run download "$RUN_ID" -n Quest3-Pyrowave-Windows -D "$RUNNER_TEMP/windows"
          gh release download "$REFERENCE_TAG" -p APK-CERTIFICATE.txt -D "$RUNNER_TEMP/reference"
      - name: Verify and assemble assets
        run: |
          python3 tools/ci/release_assets.py --android "$RUNNER_TEMP/android" --windows "$RUNNER_TEMP/windows" \
            --out "$RUNNER_TEMP/release" --run-id "$RUN_ID" --source-sha "$SOURCE_SHA" --tag "$TAG" \
            --reference-cert "$RUNNER_TEMP/reference/APK-CERTIFICATE.txt" --expect-version "$EXPECT_VERSION"
          ls -l "$RUNNER_TEMP/release"
      - name: Publish prerelease
        run: |
          set -eu
          {
            cat "$NOTES_PATH"
            printf '\n## Provenance\n\n'
            printf -- '- Source commit: `%s`\n' "$SOURCE_SHA"
            printf -- '- Built by: %s\n' "$RUN_URL"
            printf -- '- APK signing certificate matches `%s`; see `APK-CERTIFICATE.txt`.\n' "$REFERENCE_TAG"
            printf -- '- `BUILD-METADATA.json` and `SHA256SUMS.txt` list every asset hash.\n'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$RUNNER_TEMP"/release/* --target "$SOURCE_SHA" --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md" --prerelease
