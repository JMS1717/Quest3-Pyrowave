[package]
name = "quicprobe"
version = "0.1.0"
edition = "2021"

# Deliberately not a workspace member and not in the repo: this exists to answer one question --
# whether QUIC can carry 600 Mbps to this headset -- before any of it reaches alvr/sockets.

[dependencies]
anyhow = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }

[profile.release]
opt-level = 3
