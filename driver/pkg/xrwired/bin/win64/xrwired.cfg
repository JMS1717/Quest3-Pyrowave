# XR Wired driver settings. Defaults are the measured sweet spot: 400 Mbps H.264 holds 72 fps with
# ~27 ms send-to-photons on Wi-Fi 7, while 800 Mbps costs latency for no visible gain.
# Per eye 1424x1664: the headset's own 0.856 aspect, at the pixel rate its decoder is happy with.
width=2848
height=1664
fps=72
mbps=400
port=45100
# The headset client listens; leave client_ip empty to wait for it to dial us instead.
client_ip=192.0.2.10
codec=h264
preset=1
tuning=ll
ipd=0.063
fov_left=-1.40134
fov_right=0.83541
fov_up=1.30649
fov_down=-1.30649
