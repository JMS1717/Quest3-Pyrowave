plugins { id 'com.android.application' }

android {
    namespace 'com.xrwired.receiverxr'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.xrwired.receiverxr'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // Vendored OpenXR loader (see ../THIRD_PARTY.md) ships straight into the APK.
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            // The loader is prebuilt and already stripped; keep it byte-identical.
            useLegacyPackaging false
            keepDebugSymbols += ['**/libopenxr_loader.so']
        }
    }
}

// No remote dependencies: the OpenXR loader and headers are vendored so --offline builds work.
dependencies {
}
